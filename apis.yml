  properties:
  - url: https://docs.deepsource.com/docs/developers/api
    type: Documentation
  - url: https://docs.deepsource.com/docs/developers/api/schema
    type: APIReference
  - url: graphql/deepsource-graphql.md
    type: GraphQL
  - url: openapi/deepsource-openapi.yml
    type: OpenAPI
  description: GraphQL access to detected issues, issue occurrences, dependency
    vulnerability (SCA) occurrences, ignore rules, and team-level issue suppression
