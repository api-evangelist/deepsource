  properties:
  - url: https://docs.deepsource.com/docs/developers/api
    type: Documentation
  - url: https://docs.deepsource.com/docs/developers/api/schema
    type: APIReference
  - url: graphql/deepsource-graphql.md
    type: GraphQL
  - url: openapi/deepsource-openapi.yml
    type: OpenAPI
  description: GraphQL queries over the `run` root field and a repository's
    `analysisRuns` - fetch analysis runs by UID or commit SHA, their per-analyzer
