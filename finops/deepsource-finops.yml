description: >-
  FinOps view of DeepSource spend. DeepSource bills the Team plan per active
  contributor per month (annual billing), with a free Open Source plan for
  public repositories and a custom-priced Enterprise plan for self-hosted
  deployments. AI Review and Autofix are pay-as-you-go credits on the Open
  Source plan. The primary cost driver is the count of active (committing)
  contributors, since read-only and non-committing members are not billed.
notes: >-
  Per-seat rate ($24/active contributor/month, annual) reflects the February
  2026 pricing change and may change; verify against the live DeepSource pricing
  page during reconciliation.
