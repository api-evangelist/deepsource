- name: pr_reviews
  description: Pull request reviews consumed against plan-included monthly allotment.
  unit: reviews
  aggregation: sum
  dimensions:
  - account
  - repository
principles:
- name: Visibility
  description: Track the count of active contributors per team; reconcile seat counts against the DeepSource billing page each cycle.
- name: Allocation
  description: Map repositories and teams to internal cost centers; attribute AI Review / Autofix credits per repo.
- name: Optimization
  description: Keep read-only and non-committing members unbilled; move qualifying public repos to the free Open Source plan; right-size active-contributor seats.
- name: Accountability
  description: Assign an owner per team / account; review seat count and pay-as-you-go credit burn against budget on the annual cycle.
