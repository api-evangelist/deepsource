meters:
- name: active_contributors
  description: Active (committing) contributors on the Team plan, billed per seat per month with annual billing.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - team
- name: ai_review_credits
  description: Pay-as-you-go AI Review usage on the Open Source plan.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - repository
- name: autofix_credits
  description: Pay-as-you-go Autofix usage on the Open Source plan.
  unit: credits
  aggregation: sum
  dimensions:
  - account
